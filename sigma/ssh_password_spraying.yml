title: SSH Password Spraying From One Source
id: 6a1d1f10-0a08-4a21-9a08-spraying000001
status: experimental
description: >
  Failed SSH logins for many different usernames from one source in a short time.
  Spraying tries a few guesses against many accounts, so it stays under a
  per-user brute-force threshold. The built-in brute-force rule misses it.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: home-soc-lab
date: 2026/10/27
logsource:
  product: linux
  service: auth
detection:
  selection:
    program: sshd
    result: failed
  timeframe: 120s
  condition: selection | count(dst_user) by src_ip >= 6
falsepositives:
  - A shared jump host with several users failing at once. Rare.
level: high
tags:
  - attack.credential-access
  - attack.t1110.003
wazuh:
  id: 100222
  level: 12
  parent:
    if_matched_sid: '5710'
    frequency: 6
    timeframe: 120
    modifiers: [same_source_ip, different_srcuser]
