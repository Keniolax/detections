name: detections-ci

# The firing proof needs the whole Wazuh lab, which is too heavy for CI. CI
# guards the parts that do not need a lab: the Sigma rules are well-formed, the
# Wazuh ruleset is in sync with them, and every rule maps to a technique.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Sigma rules valid and in sync with the Wazuh ruleset
        run: |
          python convert/sigma_to_wazuh.py --check
          python -m pytest tests -q
